name: Mirror

# Regenerates the mirror (StellarEngine-Mono) from the repositories of its components, then its site.
#
# The mirror is never worked in: every commit of it is a snapshot made by scripts/mirror.ps1, here or on a machine.
# This workflow takes the list of components from the .orchestra file of the last snapshot, clones each at its
# default branch, makes a new snapshot when anything changed and pushes it. A push with the token of an app starts the
# workflows of the mirror as any push does: the docs workflow builds the site.
#
# It lives in the core like everything the mirror holds, but runs only where the repository variable
# STELLAR_MIRROR is 'true' (Settings -> Secrets and variables -> Actions -> Variables): in the mirror.
# Public components work with the token of the workflow. A component it cannot clone (a private repository) is kept
# as the mirror has it; the secret STELLAR_MIRROR_TOKEN (a fine-grained token with read access to their contents)
# lets the workflow refresh private ones too.
#
# The rulesets of the mirror let nobody write its branch, and the token of a workflow can neither pass a ruleset nor
# change a file of .github/workflows/, which a snapshot does whenever the core did. So the snapshot is pushed with the
# token of a GitHub App of the organization. Set once:
#   - the app: repository permissions Contents and Workflows, read and write; installed on the mirror only;
#   - the mirror, Settings -> Secrets and variables -> Actions: the variable STELLAR_MIRROR_APP_ID (its client ID) and
#     the secret STELLAR_MIRROR_APP_KEY (its private key);
#   - the mirror, Settings -> Rules -> the ruleset of the branch: the app in the bypass list.
# The first snapshot comes from a machine: scripts/mirror.ps1 -Push. After that this workflow is the only writer:
# on a machine, mirror.ps1 without -Push shows the next snapshot, Run workflow here publishes it.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot the orchestra
    if: vars.STELLAR_MIRROR == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the mirror
        uses: actions/checkout@v5
        with:
          # Its own credentials would add a second Authorization header to every request to github.com
          persist-credentials: false

      # Writes the mirror: a token of this job only, for this repository and these two permissions
      - name: Token of the mirror app
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STELLAR_MIRROR_APP_ID }}
          private-key: ${{ secrets.STELLAR_MIRROR_APP_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Clone the components
        id: workspace
        shell: pwsh
        env:
          COMPONENTS_TOKEN: ${{ secrets.STELLAR_MIRROR_TOKEN || github.token }}
        run: |
          if (-not (Test-Path .orchestra)) {
            throw 'No .orchestra here: make the first snapshot on a machine with scripts/mirror.ps1 -Push'
          }

          # The snapshot is committed by the mirror itself
          git config --global user.name 'stellar-mirror'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Credentials in a header, never in a URL (the URLs end up in .orchestra), one per repository: headers of
          # every matching http.<url> are all sent, and GitHub refuses a request with two Authorization headers.
          # Both spellings of a repository, with and without .git, since requests use the one of the remote
          function Set-Credentials([string]$Repository, [string]$Token) {
            $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$Token"))
            $bare = $Repository -replace '\.git$', ''
            foreach ($url in $bare, "$bare.git") {
              git config --global --replace-all "http.$url.extraheader" "AUTHORIZATION: basic $basic"
            }
          }

          $mirrorRepository = 'https://github.com/${{ github.repository }}'

          $workspace = Join-Path $env:RUNNER_TEMP 'orchestra'
          $components = @((Get-Content .orchestra -Raw | ConvertFrom-Json).Components)
          foreach ($component in $components) {
            if ("$($component.Repository)" -like 'https://github.com/*' -and ($component.Repository -replace '\.git$', '') -ne $mirrorRepository) {
              Set-Credentials $component.Repository $env:COMPONENTS_TOKEN
            }
          }
          # The core first: it is the root the others are cloned into
          $keep = [System.Collections.Generic.List[string]]::new()
          foreach ($component in ($components | Sort-Object { [bool]$_.Area })) {
            $target = if ($component.Area) { Join-Path $workspace "$($component.Area)/$($component.Name)" } else { $workspace }
            if ($component.Repository) { git clone --quiet $component.Repository $target 2>$null }
            if ($component.Repository -and $LASTEXITCODE -eq 0) {
              Write-Host "$($component.Name): $(git -C $target log -1 --format='%h %s')"
              continue
            }
            if (-not $component.Area) { throw "Cannot clone the core from $($component.Repository)" }
            # A private repository without a token for it, or one gone: the mirror keeps what it has
            Write-Host "::warning::$($component.Name) cannot be cloned from '$($component.Repository)': kept as the mirror has it"
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            $keep.Add($component.Name)
          }
          "path=$workspace" >> $env:GITHUB_OUTPUT
          "keep=$($keep -join ',')" >> $env:GITHUB_OUTPUT

      - name: Snapshot and push
        id: snapshot
        shell: pwsh
        env:
          MIRROR_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # The same form of credentials as for the components: in a header, for both spellings of the repository
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:MIRROR_TOKEN"))
          foreach ($url in 'https://github.com/${{ github.repository }}', 'https://github.com/${{ github.repository }}.git') {
            git config --global --replace-all "http.$url.extraheader" "AUTHORIZATION: basic $basic"
          }

          $workspace = '${{ steps.workspace.outputs.path }}'
          $keep = @('${{ steps.workspace.outputs.keep }}' -split ',' | Where-Object { $_ })

          # A version of the orchestra (the one of the core) with no tag in the mirror yet is a release
          $version = [regex]::Match((Get-Content "$workspace/Shared/Build/Stellar.Versions.props" -Raw),
            '<StellarOrchesterVersion>([^<]+)</StellarOrchesterVersion>').Groups[1].Value
          $tag = "v$version"
          $release = -not (git ls-remote --tags origin "refs/tags/$tag")

          # Parameters by name (a hashtable): an array splatted into a script binds by position, and '-Tag' once
          # became the branch of the mirror
          $arguments = @{ Remote = 'https://github.com/${{ github.repository }}.git'; Push = $true; Keep = $keep }
          if ($release) { $arguments.Tag = $tag }
          & "$workspace/scripts/mirror.ps1" @arguments
          "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "workspace=$workspace" >> $env:GITHUB_OUTPUT

      - name: Release the orchestra
        if: steps.snapshot.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.snapshot.outputs.version }}'
          $orchestra = git --git-dir '${{ steps.snapshot.outputs.workspace }}/.mirror' show '${{ steps.snapshot.outputs.tag }}:.orchestra' | Out-String | ConvertFrom-Json
          $rows = $orchestra.Components | ForEach-Object {
            $repository = "$($_.Repository)" -replace '\.git$', ''
            "| [$($_.Name)]($repository) | $($_.Version) | [``$("$($_.Commit)".Substring(0, 10))``]($repository/commit/$($_.Commit)) |"
          }
          $site = [regex]::Match((Get-Content '${{ steps.snapshot.outputs.workspace }}/Shared/Build/Stellar.Versions.props' -Raw),
            '<StellarSiteUri>([^<]+)</StellarSiteUri>').Groups[1].Value
          $notes = @(
            "StellarEngine ${version}: the orchestra, every component at the commit below.",
            '',
            '| Component | Version | Commit |',
            '|---|---|---|'
          ) + $rows + @(
            '',
            'Install it (the latest release is the default):',
            '',
            '```powershell',
            "`$env:STELLAR_INSTALL_VERSION='$version'; irm ${site}install.ps1 | iex",
            '```'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $notes -join "`n" | Set-Content -Encoding utf8 $notesFile
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create '${{ steps.snapshot.outputs.tag }}' --repo '${{ github.repository }}' --verify-tag --title "StellarEngine $version" --notes-file $notesFile @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
