name: Release

# A release is a decision, taken by hand: a new StellarOrchesterVersion in Shared/Build/Stellar.Versions.props
# (Docs/Engine/Versioning.md). When master carries a version that has no tag yet, this workflow turns the decision
# into the tag v<version> and a GitHub release of the core.
#
# The orchestra is released by the mirror: its workflow tags the snapshot with the same version and publishes the
# release the installer installs. With the secret STELLAR_DISPATCH_TOKEN (a fine-grained token allowed to run the
# Actions of the mirror) this workflow starts it at once; without it the release of the orchestra waits for the
# nightly run of the mirror, or for Run workflow there.
#
# The mirror holds this file too, as everything of the core: it never runs there (STELLAR_MIRROR is 'true').

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release the core
    if: vars.STELLAR_MIRROR != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag and publish
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $props = Get-Content Shared/Build/Stellar.Versions.props -Raw
          function Get-Version([string]$Name) { [regex]::Match($props, "<$Name>([^<]+)</$Name>").Groups[1].Value }

          $version = Get-Version 'StellarOrchesterVersion'
          $tag = "v$version"
          if (git tag --list $tag) {
            Write-Host "$tag exists: nothing to release"
            "released=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $site = Get-Version 'StellarSiteUri'
          $components = 'Kernel', 'Core', 'Runtime', 'Tools', 'Sdk', 'Cli' |
            ForEach-Object { "| Stellar.$_ | $(Get-Version "Stellar$($_)Version") |" }
          $notes = @(
            "The core of StellarEngine $version.",
            '',
            '| Component | Version |',
            '|---|---|'
          ) + $components + @(
            '',
            'Install the orchestra of this version:',
            '',
            '```powershell',
            "`$env:STELLAR_INSTALL_VERSION='$version'; irm ${site}install.ps1 | iex",
            '```'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          $notes -join "`n" | Set-Content -Encoding utf8 $notesFile

          # A suffix (-alpha, -rc.1) makes a pre-release, which is never the latest one an installer takes
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $tag --target $env:GITHUB_SHA --title "StellarEngine-Core $version" --notes-file $notesFile --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }
          "released=true" >> $env:GITHUB_OUTPUT

      - name: Start the mirror
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.STELLAR_DISPATCH_TOKEN }}
          MIRROR: ${{ vars.STELLAR_MIRROR_REPOSITORY || 'QuantumDevTeam/StellarEngine-Mono' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No STELLAR_DISPATCH_TOKEN: the orchestra is released by the next run of the mirror ($MIRROR)"
            exit 0
          fi
          gh workflow run mirror.yml --repo "$MIRROR" --ref master
